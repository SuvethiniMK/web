
<!DOCTYPE html>
<html>
<head>
    <title>Dream Cars Showroom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚗 Dream Cars Showroom</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#cars">Cars</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section id="home">
        <h2>Welcome to Dream Cars</h2>
        <p>Find Your Dream Car Here!</p>
        <a href="#cars" class="btn">Explore Cars</a>
    </section>

    <section id="cars">
        <h2>Our Cars</h2>

        <div class="car">
            <img src="https://placehold.co/300x180?text=BMW" alt="BMW">
            <h3>BMW</h3>
            <p>Price: ₹50,00,000</p>
            <button onclick="alert('BMW Selected!')">Book Now</button>
        </div>

        <div class="car">
            <img src="https://placehold.co/300x180?text=Audi" alt="Audi">
            <h3>Audi</h3>
            <p>Price: ₹45,00,000</p>
            <button onclick="alert('Audi Selected!')">Book Now</button>
        </div>

        <div class="car">
            <img src="https://placehold.co/300x180?text=Mercedes" alt="Mercedes">
            <h3>Mercedes</h3>
            <p>Price: ₹60,00,000</p>
            <button onclick="alert('Mercedes Selected!')">Book Now</button>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <p>Email: dreamcars@gmail.com</p>
        <p>Phone: 9876543210</p>
    </section>

    <footer>
        <p>© 2026 Dream Cars Showroom</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
